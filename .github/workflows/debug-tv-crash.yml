# Diagnostic workflow: build a Windows binary with symbols and upload the PDB,
# so that crash offsets (e.g. from Windows Error Reporting) can be resolved to
# a function and source line. Keep this workflow available for testing.
name: Build Windows symbols (diagnostic)

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: "Use sccache (GitHub Actions cache). Disable to see all compiler warnings."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  MEDIAINFO_VERSION: "24.06"
  # Use GitHub Actions cache as sccache backend (shared across runs).
  SCCACHE_GHA_ENABLED: "true"

jobs:
  symbols:
    name: Windows x64 symbols
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: "qt5compat qtmultimedia"
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        if: ${{ inputs.use_cache }}
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install zlib (vcpkg)
        run: vcpkg install zlib:x64-windows

      - name: Download MediaInfo SDK and ZenLib
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path third_party/packaging_win | Out-Null

          $url = "https://mediaarea.net/download/binary/libmediainfo0/$env:MEDIAINFO_VERSION/MediaInfo_DLL_$($env:MEDIAINFO_VERSION)_Windows_x64_WithoutInstaller.7z"
          Invoke-WebRequest -Uri $url -OutFile third_party/packaging_win/MediaInfoDLL.7z
          7z x -y -othird_party/packaging_win/mediainfo third_party/packaging_win/MediaInfoDLL.7z | Out-Null
          Copy-Item -Recurse third_party/packaging_win/mediainfo/Developers/Source/MediaInfoDLL ./MediaInfoDLL

          git clone --quiet --depth=1 --single-branch --branch=master https://github.com/MediaArea/ZenLib tmp/ZenLib
          Copy-Item -Recurse tmp/ZenLib/Source/ZenLib ./ZenLib
          Remove-Item -Recurse -Force tmp

      - name: Configure
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:/vcpkg" }

          # /Z7 instead of /Zi: debug info is embedded in the object files, so
          # parallel sccache compiles do not fight over a shared PDB (C1041).
          $cmakeArgs = @(
            "-S", ".", "-B", "build", "-G", "Ninja",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Z7",
            "-DCMAKE_C_FLAGS_RELEASE=/O2 /Ob2 /DNDEBUG /Z7",
            "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG",
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR",
            "-DZLIB_ROOT=$vcpkgRoot/installed/x64-windows",
            "-DQUAZIP_BZIP2=OFF",
            "-DENABLE_TESTS=ON",
            "-DENABLE_COLOR_OUTPUT=OFF"
          )
          if ("${{ inputs.use_cache }}" -eq "true") {
            $cmakeArgs += @(
              "-DCMAKE_C_COMPILER_LAUNCHER=sccache",
              "-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
            )
          }
          cmake @cmakeArgs

      - name: Build
        run: cmake --build build --target mediaelch mediaelch_unit_test --parallel

      - name: Show sccache statistics
        if: always() && inputs.use_cache
        run: sccache --show-stats

      - name: Upload executable and PDB
        uses: actions/upload-artifact@v4
        with:
          name: mediaelch-symbols
          path: |
            build/MediaElch.exe
            build/MediaElch.pdb
