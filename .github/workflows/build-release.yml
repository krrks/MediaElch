# Manual workflow: build a portable Windows x64 ZIP and publish it as a release.
name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (leave empty to generate v2.12.1-dev-build.<run_number>)"
        required: false
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"
  MEDIAINFO_VERSION: "24.06"
  FFMPEG_VERSION: "7.0.2"
  # Use GitHub Actions cache as sccache backend (shared across runs).
  SCCACHE_GHA_ENABLED: "true"

jobs:
  windows-x64:
    name: Windows x64 (Qt 6, MSVC)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          # qtsvg and qttools are part of Qt's base package for Qt 6.8.
          modules: "qt5compat qtmultimedia"
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install zlib (vcpkg)
        run: vcpkg install zlib:x64-windows

      - name: Download MediaInfo SDK and ZenLib
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path third_party/packaging_win | Out-Null

          $url = "https://mediaarea.net/download/binary/libmediainfo0/$env:MEDIAINFO_VERSION/MediaInfo_DLL_$($env:MEDIAINFO_VERSION)_Windows_x64_WithoutInstaller.7z"
          Invoke-WebRequest -Uri $url -OutFile third_party/packaging_win/MediaInfoDLL.7z
          7z x -y -othird_party/packaging_win/mediainfo third_party/packaging_win/MediaInfoDLL.7z | Out-Null
          Copy-Item -Recurse third_party/packaging_win/mediainfo/Developers/Source/MediaInfoDLL ./MediaInfoDLL
          Copy-Item third_party/packaging_win/mediainfo/MediaInfo.dll third_party/packaging_win/MediaInfo.dll

          git clone --quiet --depth=1 --single-branch --branch=master https://github.com/MediaArea/ZenLib tmp/ZenLib
          Copy-Item -Recurse tmp/ZenLib/Source/ZenLib ./ZenLib
          Remove-Item -Recurse -Force tmp

      - name: Configure
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:/vcpkg" }

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DZLIB_ROOT="$vcpkgRoot/installed/x64-windows" `
            -DQUAZIP_BZIP2=OFF `
            -DENABLE_TESTS=ON `
            -DENABLE_COLOR_OUTPUT=OFF

      - name: Build
        run: cmake --build build --target mediaelch mediaelch_unit_test --parallel

      - name: Run tests
        shell: pwsh
        # The test stage is kept in a script so that tests can be changed
        # without touching the workflow.
        run: ./.ci/win/run_tests.ps1 -BuildDir build

      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats

      - name: Package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "v2.12.1-dev-build.${{ github.run_number }}"
          }
          $zip = "MediaElch_win_qt6_$tag.zip"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

          $dist = "dist/MediaElch"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build/MediaElch.exe $dist/

          # QuaZip and vcpkg's zlib are shared libraries; windeployqt does not
          # know about them, so they must be shipped next to the executable.
          # Copy them *before* running windeployqt and pass them to it: QuaZip
          # itself depends on Qt5Compat (QTextCodec), which windeployqt would
          # otherwise not deploy, because MediaElch.exe does not import it.
          Copy-Item build/third_party/quazip/quazip/quazip1-qt6.dll $dist/
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:/vcpkg" }
          Copy-Item "$vcpkgRoot/installed/x64-windows/bin/*.dll" $dist/

          windeployqt --release --compiler-runtime --no-system-d3d-compiler `
            $dist/MediaElch.exe $dist/quazip1-qt6.dll

          Copy-Item COPYING $dist/
          Copy-Item third_party/packaging_win/MediaInfo.dll $dist/

          $ffmpegUrl = "https://files.ameyering.de/binaries/Windows/ffmpeg/ffmpeg-$env:FFMPEG_VERSION-essentials_build.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile third_party/packaging_win/ffmpeg.zip
          Expand-Archive -Path third_party/packaging_win/ffmpeg.zip -DestinationPath third_party/packaging_win/ffmpeg -Force
          New-Item -ItemType Directory -Force -Path "$dist/vendor" | Out-Null
          Copy-Item "third_party/packaging_win/ffmpeg/ffmpeg-$env:FFMPEG_VERSION-essentials_build/bin/ffmpeg.exe" "$dist/vendor/"

          # Sanity check: every directly imported DLL must be part of the package
          # or be a system DLL. Catches incomplete windeployqt runs early.
          $missing = @()
          foreach ($bin in @("$dist/MediaElch.exe", "$dist/quazip1-qt6.dll")) {
            $deps = (dumpbin /DEPENDENTS $bin) | Select-String '^\s+(\S+\.dll)$' |
              ForEach-Object { $_.Matches[0].Groups[1].Value }
            foreach ($d in $deps) {
              # API sets are virtual DLLs provided by the OS, not files.
              if ($d -like "api-ms-*" -or $d -like "ext-ms-*") { continue }
              if (-not (Test-Path (Join-Path $dist $d)) -and
                  -not (Test-Path (Join-Path "$env:SystemRoot/System32" $d))) {
                $missing += "$d (imported by $(Split-Path $bin -Leaf))"
              }
            }
          }
          if ($missing.Count -gt 0) {
            throw "Package is incomplete, missing DLLs: $($missing -join '; ')"
          }

          Compress-Archive -Path $dist -DestinationPath $zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaElch-windows-x64
          path: ${{ steps.package.outputs.zip }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: MediaElch Windows build ${{ github.run_number }}
          body: |
            Windows x64 build of MediaElch (Qt 6, MSVC).

            - Source commit: `${{ github.sha }}`
            - Contains the TMDb duplicate `include_adult` fix (upstream issue #1992)
            - Unsigned build without installer: extract the ZIP into an **empty**
              directory and run `MediaElch.exe`
            - Do not extract over an existing MediaElch installation. Official
              builds use MinGW; mixing their Qt DLLs with this MSVC build makes
              the application fail to start.

            This release was built automatically by GitHub Actions from a manual workflow run.
          files: ${{ steps.package.outputs.zip }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
